# Build & test on every push and pull-request targeting any long-lived branch.
# Project pins go 1.25 in go.mod; older toolchains fail with a "go: ... not
# available" error inside setup-go.
name: Go

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'

      - name: Generate sqlc code
        run: sqlc generate

      - name: Tidy
        run: go mod tidy -diff

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
