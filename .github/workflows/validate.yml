# Formatting and static-analysis checks that complement go.yml (build/test).
# Adds gofmt and go vet, which no other workflow in this repo runs today.
name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: '1.27.0'

      - name: Generate sqlc code
        run: sqlc generate

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        # structtag is disabled for one known false positive: pkg/db/gen is
        # sqlc-generated code, and one legacy vehicle-fitment table has a
        # real DB column literally named "0", which sqlc emits as an
        # unexported `_0` field with a json tag. That code is not
        # author-controlled, so we don't gate CI on it.
        run: go vet -structtag=false ./...
