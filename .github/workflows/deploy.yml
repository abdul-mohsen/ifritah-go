# =============================================================================
# Backend image build & push to Docker Hub
# =============================================================================
# Tag scheme:
#   :$(cat VERSION)  - production release tag (main)
#   :<full-sha>      - immutable per-commit tag (provenance / rollback)
#   :<short-sha>     - immutable per-commit tag (rollback / debug)
#   :dev             - moving alias to the latest dev build
#                      (published only when github.ref == refs/heads/dev)
#
# Dev tenants poll the :dev tag via scripts/auto-pull.sh in the deployment
# repo. Production tenants pin to a specific :vX.Y.Z tag and are updated
# manually via scripts/update-tenant.sh.
# VERSION is the semantic-version source of truth. Runtime build identity keeps
# that semantic version separate from the mutable image tag/ref/digest/channel.
# The manifest digest is only available after push; this workflow uses it for
# alias publication, while deployment tooling injects it into runtime env when
# containers are pinned by digest.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# =============================================================================

name: Build & Push Backend

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ifritah-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate VERSION
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-version.sh

      - name: Validate Docker image config
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required." >&2
            exit 1
          fi
          expected="${DOCKERHUB_USERNAME}/ifritah-api"
          if [[ -z "${IMAGE_NAME}" || "${IMAGE_NAME}" != "${expected}" ]]; then
            echo "IMAGE_NAME must be derived from DOCKERHUB_USERNAME." >&2
            exit 1
          fi

      - name: Set build metadata
        id: build
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            channel=dev
            image_tag=dev
          else
            channel=release
            image_tag="${{ steps.version.outputs.version }}"
          fi
          {
            echo "channel=${channel}"
            echo "image_tag=${image_tag}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "image_ref=${IMAGE_NAME}:${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ steps.build.outputs.source }}
            org.opencontainers.image.created=${{ steps.build.outputs.created }}
            org.opencontainers.image.ref.name=${{ steps.build.outputs.image_tag }}
            org.opencontainers.image.channel=${{ steps.build.outputs.channel }}
            org.opencontainers.image.workflow.run=${{ steps.build.outputs.workflow_run }}
            com.ifritah.build.channel=${{ steps.build.outputs.channel }}
            com.ifritah.build.version=${{ steps.version.outputs.version }}
            com.ifritah.build.commit=${{ github.sha }}
            com.ifritah.build.commit_short=${{ steps.version.outputs.short_sha }}
            com.ifritah.build.tag=${{ steps.build.outputs.image_tag }}
            com.ifritah.build.ref=${{ steps.build.outputs.image_ref }}
            com.ifritah.build.workflow_run_id=${{ steps.build.outputs.workflow_run }}
            com.ifritah.build.workflow_run_url=${{ steps.build.outputs.workflow_run_url }}
            com.ifritah.build.workflow_run=${{ steps.build.outputs.workflow_run }}
            com.ifritah.build.workflow_url=${{ steps.build.outputs.workflow_run_url }}
            com.ifritah.build.image_ref=${{ steps.build.outputs.image_ref }}
            com.ifritah.build.built_at=${{ steps.build.outputs.created }}

      - id: build_image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE_VERSION=${{ steps.version.outputs.version }}
            APP_IMAGE_COMMIT=${{ github.sha }}
            APP_IMAGE_CHANNEL=${{ steps.build.outputs.channel }}
            APP_IMAGE_TAG=${{ steps.build.outputs.image_tag }}
            APP_COMMIT_SHORT=${{ steps.version.outputs.short_sha }}
            APP_BUILD_CHANNEL=${{ steps.build.outputs.channel }}
            APP_BUILD_SOURCE=${{ steps.build.outputs.source }}
            APP_BUILT_AT=${{ steps.build.outputs.created }}
            APP_BUILD_WORKFLOW_RUN=${{ steps.build.outputs.workflow_run }}
            APP_BUILD_WORKFLOW_URL=${{ steps.build.outputs.workflow_run_url }}
            APP_WORKFLOW_RUN_ID=${{ steps.build.outputs.workflow_run }}
            APP_WORKFLOW_RUN_URL=${{ steps.build.outputs.workflow_run_url }}
            APP_IMAGE_REF=${{ steps.build.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-dev-alias:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker image config
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required." >&2
            exit 1
          fi
          expected="${DOCKERHUB_USERNAME}/ifritah-api"
          if [[ -z "${IMAGE_NAME}" || "${IMAGE_NAME}" != "${expected}" ]]; then
            echo "IMAGE_NAME must be derived from DOCKERHUB_USERNAME." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish :dev alias from the immutable image digest
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          DEV_IMAGE: ${{ env.IMAGE_NAME }}:dev
        # imagetools create attaches an additional tag to an already-pushed
        # image without rebuilding. This lets dev tenants track :dev while
        # every merge still leaves immutable :<full-sha> and :<short-sha> pins.
        run: docker buildx imagetools create --tag "$DEV_IMAGE" "$SOURCE_IMAGE"
