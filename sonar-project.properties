sonar.projectKey=abdul-mohsen_ifritah-go
sonar.organization=abdul-mohsen

# Exclude generated and infrastructure noise from coverage / duplication.
# Migrations are deliberately repetitive (idempotent CALL stubs) and would
# otherwise dominate the duplication ratio.
sonar.cpd.exclusions=**/migrations/**/*.sql,**/schema/**/*.sql,**/db/gen/**
# Exclude SQL files entirely from analysis. They use sqlc directives
# (sqlc.narg('xxx'), sqlc.embed) that the plsql analyzer
# misclassifies — every sentinel-filter pattern legitimately repeats
# the same `sqlc.narg('xxx')` call across UNION-ALL halves and OR-tree
# branches, which fires plsql:S1192 ("define a constant for this
# duplicated literal") with no fix available in SQL. Coverage is not
# tracked on .sql files, so excluding them is a no-op for quality
# metrics other than the false-positive code-smell stream.
sonar.exclusions=**/db/gen/**,**/db/queries/**/*.sql,**/db/migrations/**/*.sql

# (multicriteria block kept as a belt-and-braces override in case
# Automatic Analysis stops honouring sonar.exclusions for any reason.
# resourceKey is glob-relative to the project root.)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/queries/**/*.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/db/migrations/**/*.sql
