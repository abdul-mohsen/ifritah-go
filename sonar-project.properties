sonar.projectKey=abdul-mohsen_ifritah-go
sonar.projectKey=abdul-mohsen_ifritah-go
sonar.organization=abdul-mohsen

# Exclude generated and SQL artefacts from analysis & duplicate detection.
# Patterns use `**` (matches any depth incl. direct children) instead of
# `**/*` which requires at least one subdirectory and would miss files
# directly under `queries/`, `migrations/`, etc.
sonar.exclusions=pkg/db/**
sonar.cpd.exclusions=pkg/db/**

# Belt-and-braces: silence plsql:S1192 on SQL artefacts even if the
# exclusions above are overridden by dashboard settings.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/pkg/db/queries/*
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/pkg/db/migrations/*
sonar.issue.ignore.multicriteria.e3.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/pkg/db/schema/*