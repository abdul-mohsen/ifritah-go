sonar.projectKey=abdul-mohsen_ifritah-go
sonar.organization=abdul-mohsen

# Exclude generated and infrastructure noise from coverage / duplication.
# Migrations are deliberately repetitive (idempotent CALL stubs) and would
# otherwise dominate the duplication ratio.
sonar.cpd.exclusions=**/migrations/**/*.sql,**/schema/**/*.sql,**/db/gen/**
sonar.exclusions=**/db/gen/**

# sqlc.narg('xxx') is the required syntax for nullable named params.
# It legitimately repeats across UNION-ALL halves and OR-tree branches
# in our sentinel-filter pattern, so plsql:S1192 (string literal dupes)
# fires on every list query. Suppress it under queries/migrations
# where the duplication is structural, not accidental.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=pkg/db/queries/**
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=pkg/db/migrations/**
