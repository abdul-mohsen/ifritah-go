# =============================================================================
# Backend image build & push to Docker Hub
# =============================================================================
# Tag scheme:
#   :$(cat VERSION)  - production release tag (both main and dev)
#   :<short-sha>     - immutable per-commit tag (rollback / debug)
#   :dev             - moving alias to the latest dev build
#                      (published only when github.ref == refs/heads/dev)
#
# Dev tenants poll the :dev tag via scripts/auto-pull.sh in the deployment
# repo. Production tenants pin to a specific :vX.Y.Z tag and are updated
# manually via scripts/update-tenant.sh.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
# =============================================================================

name: Build & Push Backend

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ifritah-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate VERSION
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-version.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-dev-alias:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish :dev alias from the immutable short-sha tag
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short_sha }}
          DEV_IMAGE: ${{ env.IMAGE_NAME }}:dev
        # imagetools create attaches an additional tag to an already-pushed
        # image without rebuilding. This lets dev tenants track :dev while
        # every merge still leaves an immutable :<short-sha> pin.
        run: docker buildx imagetools create --tag "$DEV_IMAGE" "$SOURCE_IMAGE"
