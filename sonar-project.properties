sonar.projectKey=abdul-mohsen_ifritah-go
sonar.organization=abdul-mohsen

# Exclude generated, migration, and query SQL from all analysis.
# - db/gen/**       — sqlc-generated Go (no manual code)
# - db/migrations/* — idempotent CALL stubs; intrinsically repetitive
# - db/queries/*    — sqlc query templates with sentinel-filter pattern
#   (`(sqlc.narg('x') IS NULL OR col LIKE sqlc.narg('x'))` repeats by
#   design; the plsql analyzer also misclassifies sqlc directives).
sonar.exclusions=pkg/db/gen/**,pkg/db/queries/**,pkg/db/migrations/**,pkg/db/schema/**

# Same set for duplicate-line detection. Listed separately so a future
# narrowing of `sonar.exclusions` doesn't accidentally re-enable CPD on
# these files. The CPD module ignores `sonar.exclusions` for some
# rules, hence the explicit duplicate.
sonar.cpd.exclusions=pkg/db/gen/**,pkg/db/queries/**,pkg/db/migrations/**,pkg/db/schema/**

# Belt-and-braces: silence plsql:S1192 in case Automatic Analysis still
# reaches the SQL files via a different path. resourceKey patterns are
# evaluated relative to the project root.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=pkg/db/queries/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=pkg/db/migrations/**/*
