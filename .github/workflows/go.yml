# Build & test on every push and pull-request targeting any long-lived branch.
# Project pins go 1.25 in go.mod; older toolchains fail with a "go: ... not
# available" error inside setup-go.
name: Go

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate VERSION
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-version.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@c0209b9199cd1cce6a14fc27cabcec491b651761 # v4
        with:
          sqlc-version: '1.27.0'

      - name: Generate sqlc code
        run: sqlc generate

      - name: Tidy
        run: go mod tidy -diff

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
